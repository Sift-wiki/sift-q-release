name: publish-npm

# Public, GitHub-hosted OIDC relay for @sift-wiki/q. The private development
# workflow builds, deploys and canaries one immutable candidate. This relay
# consumes that exact candidate by run ID; it never rebuilds the package.
#
# Trust split:
#   select  — no id-token. A repo-scoped read-only token fetches one successful
#             deploy-development run and its one 3-file artifact. The relay's
#             verifier checks run/repository/workflow/main lineage, both signed
#             receipts, source/tree/receipt/tarball digests and package metadata.
#   publish — no private-repository token or private checkout. It receives only the
#             verified tarball, rechecks its digest and registry absence, and is
#             the sole job allowed to request an npm OIDC token. It publishes
#             under `next`. It never executes candidate code.
#   verify-registry — no id-token, private token, environment, or write authority.
#             It checks out only this public verifier, fetches the registry-served
#             bytes through canonical npm, byte-compares and canaries them, then
#             re-reads both tags and emits non-authoritative transition evidence.
#
# Required candidate-selection environment configuration:
#   variable CANDIDATE_SELECTION_LANE=exact-development-candidate
#   secret   SIFT_Q_READ_TOKEN (fine-grained, private source repo only:
#            Contents:read, Actions:read, Metadata:read)
#   secret   DEVELOPMENT_CANDIDATE_TRUST_POLICY_JSON
# Required production environment configuration:
#   variable NPM_PUBLISHER_LANE=github-actions-oidc
#
# Every action is commit-SHA pinned. npm is exact-pinned. The production
# environment must remain main-only and reviewer protected.
on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful deploy-development workflow run ID to consume.
        type: string
        required: true
      candidate_receipt_digest:
        description: Exact sha256:... digest of signed-development-candidate.json.
        type: string
        required: true
      dry_run:
        description: Verify the exact candidate and registry preflight without publishing.
        type: boolean
        default: true
      expected_version:
        description: Optional stable x.y.z version expected in the signed tarball.
        type: string
        default: ""

permissions: {}

concurrency:
  group: npm-publish
  cancel-in-progress: false

env:
  PACKAGE: "@sift-wiki/q"
  SOURCE_REPO: Sift-wiki/sift-q-refactor
  NPM_VERSION: 11.19.0

jobs:
  select:
    name: verify the exact development candidate
    runs-on: ubuntu-latest
    environment: candidate-selection
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      candidate_receipt_digest: ${{ steps.candidate.outputs.candidate_receipt_digest }}
      run_attempt: ${{ steps.candidate.outputs.run_attempt }}
      run_id: ${{ steps.candidate.outputs.run_id }}
      source_sha: ${{ steps.candidate.outputs.source_sha }}
      tarball_sha256: ${{ steps.candidate.outputs.tarball_sha256 }}
      tree_sha: ${{ steps.candidate.outputs.tree_sha }}
      version: ${{ steps.candidate.outputs.version }}
    steps:
      - name: refuse unless the lane is switched on
        env:
          CANDIDATE_SELECTION_LANE: ${{ vars.CANDIDATE_SELECTION_LANE }}
        run: |
          set -euo pipefail
          if [ "${CANDIDATE_SELECTION_LANE:-}" != "exact-development-candidate" ]; then
            echo "refusing: candidate-selection CANDIDATE_SELECTION_LANE is not exact-development-candidate"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: relay
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: require the legacy private publisher to be disabled
        env:
          GH_TOKEN: ${{ secrets.SIFT_Q_READ_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          BOUNDARY="$RUNNER_TEMP/candidate-boundary"
          mkdir -p "$BOUNDARY"
          gh api "repos/$SOURCE_REPO" >"$BOUNDARY/source-repository.json"
          gh api "repos/$SOURCE_REPO/actions/workflows/publish-npm.yml" \
            >"$BOUNDARY/legacy-publisher-workflow.json"
          node relay/scripts/verify-exact-candidate.mjs verify-legacy-publisher \
            --repository "$BOUNDARY/source-repository.json" \
            --workflow "$BOUNDARY/legacy-publisher-workflow.json"

      - name: verify the private run and fetch its one exact artifact
        id: run
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          GH_TOKEN: ${{ secrets.SIFT_Q_READ_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          case "$CANDIDATE_RUN_ID" in
            ''|*[!0-9]*|0*) echo "refusing: candidate_run_id is invalid"; exit 1 ;;
          esac
          BOUNDARY="$RUNNER_TEMP/candidate-boundary"
          mkdir -p "$BOUNDARY" "$RUNNER_TEMP/development-candidate"
          gh api "repos/$SOURCE_REPO/actions/runs/$CANDIDATE_RUN_ID" >"$BOUNDARY/run.json"
          CANDIDATE_SHA=$(node -e '
            const value = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
            if (!/^[0-9a-f]{40}$/.test(value.head_sha ?? "")) process.exit(1);
            process.stdout.write(value.head_sha);
          ' "$BOUNDARY/run.json")
          gh api "repos/$SOURCE_REPO/actions/runs/$CANDIDATE_RUN_ID/artifacts?per_page=100" >"$BOUNDARY/artifacts.json"
          gh api "repos/$SOURCE_REPO/commits/$CANDIDATE_SHA" >"$BOUNDARY/candidate-commit.json"
          gh api "repos/$SOURCE_REPO/git/ref/heads/main" >"$BOUNDARY/current-main.json"
          gh api "repos/$SOURCE_REPO/compare/$CANDIDATE_SHA...main" >"$BOUNDARY/comparison.json"
          node relay/scripts/verify-exact-candidate.mjs select-run \
            --run "$BOUNDARY/run.json" \
            --artifacts "$BOUNDARY/artifacts.json" \
            --candidate-commit "$BOUNDARY/candidate-commit.json" \
            --current-main "$BOUNDARY/current-main.json" \
            --comparison "$BOUNDARY/comparison.json" \
            --run-id "$CANDIDATE_RUN_ID" \
            --output "$BOUNDARY/selection.json"
          ARTIFACT_ID=$(node -p 'require(process.argv[1]).artifactId' "$BOUNDARY/selection.json")
          gh api "repos/$SOURCE_REPO/actions/artifacts/$ARTIFACT_ID/zip" >"$BOUNDARY/candidate.zip"
          EXPECTED=$(printf '%s\n' npm-package.tgz signed-development-candidate.json signed-npm-runtime-canary.json | sort)
          ACTUAL=$(unzip -Z1 "$BOUNDARY/candidate.zip" | sort)
          test "$ACTUAL" = "$EXPECTED" || {
            echo "refusing: candidate zip does not contain exactly the expected three top-level files"
            printf 'expected:\n%s\nactual:\n%s\n' "$EXPECTED" "$ACTUAL"
            exit 1
          }
          unzip -q "$BOUNDARY/candidate.zip" -d "$RUNNER_TEMP/development-candidate"
          echo "candidate_sha=$CANDIDATE_SHA" >>"$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Sift-wiki/sift-q-refactor
          token: ${{ secrets.SIFT_Q_READ_TOKEN }}
          ref: main
          path: source
          persist-credentials: false

      - name: verify signatures, receipts, source identity, and exact tarball bytes
        id: candidate
        env:
          CANDIDATE_RECEIPT_DIGEST: ${{ inputs.candidate_receipt_digest }}
          CANDIDATE_TRUST_POLICY_JSON: ${{ secrets.DEVELOPMENT_CANDIDATE_TRUST_POLICY_JSON }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          set -euo pipefail
          umask 077
          test -n "${CANDIDATE_TRUST_POLICY_JSON:-}" || {
            echo "refusing: DEVELOPMENT_CANDIDATE_TRUST_POLICY_JSON is missing"
            exit 1
          }
          BOUNDARY="$RUNNER_TEMP/candidate-boundary"
          CURRENT_MAIN=$(node -p 'require(process.argv[1]).currentMainSha' "$BOUNDARY/selection.json")
          test "$(git -C source rev-parse HEAD)" = "$CURRENT_MAIN" || {
            echo "refusing: verifier checkout is not the current private main"
            exit 1
          }
          printf '%s' "$CANDIDATE_TRUST_POLICY_JSON" >"$BOUNDARY/trust-policy.json"
          node relay/scripts/verify-exact-candidate.mjs verify-candidate \
            --source-root source \
            --candidate-directory "$RUNNER_TEMP/development-candidate" \
            --trust-policy "$BOUNDARY/trust-policy.json" \
            --selection "$BOUNDARY/selection.json" \
            --receipt-digest "$CANDIDATE_RECEIPT_DIGEST" \
            --expected-version "$EXPECTED_VERSION" \
            --output "$BOUNDARY/verified.json"
          VERSION=$(node -p 'require(process.argv[1]).version' "$BOUNDARY/verified.json")
          SOURCE_SHA=$(node -p 'require(process.argv[1]).sourceSha' "$BOUNDARY/verified.json")
          TARBALL_SHA256=$(node -p 'require(process.argv[1]).tarballSha256' "$BOUNDARY/verified.json")
          TREE_SHA=$(node -p 'require(process.argv[1]).treeSha' "$BOUNDARY/verified.json")
          RUN_ID=$(node -p 'require(process.argv[1]).runId' "$BOUNDARY/verified.json")
          RUN_ATTEMPT=$(node -p 'require(process.argv[1]).runAttempt' "$BOUNDARY/verified.json")
          CANDIDATE_RECEIPT_DIGEST=$(node -p 'require(process.argv[1]).candidateReceiptDigest' "$BOUNDARY/verified.json")
          echo "version=$VERSION" >>"$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >>"$GITHUB_OUTPUT"
          echo "tarball_sha256=$TARBALL_SHA256" >>"$GITHUB_OUTPUT"
          echo "tree_sha=$TREE_SHA" >>"$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >>"$GITHUB_OUTPUT"
          echo "run_attempt=$RUN_ATTEMPT" >>"$GITHUB_OUTPUT"
          echo "candidate_receipt_digest=$CANDIDATE_RECEIPT_DIGEST" >>"$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/verified-artifact"
          cp "$RUNNER_TEMP/development-candidate/npm-package.tgz" \
            "$RUNNER_TEMP/verified-artifact/sift-wiki-q-$VERSION.tgz"

      - name: refuse an already-published or unreadable registry version
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          VERSION: ${{ steps.candidate.outputs.version }}
        run: |
          set -euo pipefail
          PUBLISHED=$(npm view "$PACKAGE" versions --json) || {
            echo "refusing: cannot read $PACKAGE versions from npm"
            exit 1
          }
          node -e '
            const [version, body] = process.argv.slice(1);
            let versions;
            try { versions = JSON.parse(body); } catch { process.exit(2); }
            if (typeof versions === "string") versions = [versions];
            if (!Array.isArray(versions) || versions.length === 0) process.exit(2);
            if (versions.includes(version) && process.env.DRY_RUN !== "true") process.exit(3);
          ' "$VERSION" "$PUBLISHED" || {
            STATUS=$?
            test "$STATUS" = 3 && echo "refusing: $PACKAGE@$VERSION already exists"
            test "$STATUS" = 2 && echo "refusing: npm returned an unreadable version list"
            exit 1
          }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !inputs.dry_run }}
        with:
          name: exact-candidate-tarball
          path: ${{ runner.temp }}/verified-artifact/*.tgz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: candidate summary
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          SOURCE_SHA: ${{ steps.candidate.outputs.source_sha }}
          TARBALL_SHA256: ${{ steps.candidate.outputs.tarball_sha256 }}
          VERSION: ${{ steps.candidate.outputs.version }}
        run: |
          {
            echo "## exact candidate verified"
            echo
            echo "- source: $SOURCE_REPO @ $SOURCE_SHA"
            echo "- package: $PACKAGE@$VERSION"
            echo "- tarball sha256: $TARBALL_SHA256"
            echo "- registry write: $([ "$DRY_RUN" = true ] && echo SKIPPED || echo pending)"
          } >>"$GITHUB_STEP_SUMMARY"

  publish:
    name: publish the verified exact bytes with OIDC
    needs: select
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    outputs:
      latest_before: ${{ steps.registry_preflight.outputs.latest_before }}
    env:
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
      NPM_CONFIG_USERCONFIG: /dev/null
    steps:
      - name: refuse unless the npm OIDC lane is switched on
        env:
          NPM_PUBLISHER_LANE: ${{ vars.NPM_PUBLISHER_LANE }}
        run: |
          set -euo pipefail
          if [ "${NPM_PUBLISHER_LANE:-}" != "github-actions-oidc" ]; then
            echo "refusing: production NPM_PUBLISHER_LANE is not github-actions-oidc"
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: install the exact npm OIDC client
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          npm_prefix="$RUNNER_TEMP/npm-pinned"
          npm install -g --prefix "$npm_prefix" --ignore-scripts --no-audit --no-fund "npm@$NPM_VERSION"
          echo "$npm_prefix/bin" >> "$GITHUB_PATH"
          test "$("$npm_prefix/bin/npm" --version)" = "$NPM_VERSION" || {
            echo "refusing: npm version mismatch"
            exit 1
          }

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: exact-candidate-tarball
          path: ${{ runner.temp }}/verified-artifact

      - name: reverify the selected bytes and registry absence
        id: registry_preflight
        env:
          EXPECTED_SHA256: ${{ needs.select.outputs.tarball_sha256 }}
          VERSION: ${{ needs.select.outputs.version }}
        run: |
          set -euo pipefail
          TARBALL="$RUNNER_TEMP/verified-artifact/sift-wiki-q-$VERSION.tgz"
          test -f "$TARBALL" && test ! -L "$TARBALL" || { echo "refusing: exact tarball missing"; exit 1; }
          test "$(find "$RUNNER_TEMP/verified-artifact" -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 1 || {
            echo "refusing: verified artifact contains unexpected files"
            exit 1
          }
          ACTUAL=$(sha256sum "$TARBALL" | cut -d' ' -f1)
          test "$ACTUAL" = "$EXPECTED_SHA256" || { echo "refusing: tarball changed after selection"; exit 1; }
          LATEST_BEFORE=$(npm view "$PACKAGE" dist-tags.latest) || {
            echo "refusing: cannot read the existing latest tag"
            exit 1
          }
          node -e '
            if (!/^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/.test(process.argv[1])) process.exit(1);
          ' "$LATEST_BEFORE" || { echo "refusing: existing latest tag is invalid"; exit 1; }
          node -e '
            const parse = value => value.split(".").map(BigInt);
            const [candidate, latest] = process.argv.slice(1).map(parse);
            for (let i = 0; i < 3; i += 1) {
              if (candidate[i] > latest[i]) process.exit(0);
              if (candidate[i] < latest[i]) process.exit(1);
            }
            process.exit(1);
          ' "$VERSION" "$LATEST_BEFORE" || { echo "refusing: candidate version does not advance latest"; exit 1; }
          PUBLISHED=$(npm view "$PACKAGE" versions --json) || {
            echo "refusing: cannot read $PACKAGE versions from npm"
            exit 1
          }
          node -e '
            const [version, body] = process.argv.slice(1);
            let versions;
            try { versions = JSON.parse(body); } catch { process.exit(2); }
            if (typeof versions === "string") versions = [versions];
            if (!Array.isArray(versions) || versions.length === 0) process.exit(2);
            if (versions.includes(version)) process.exit(3);
          ' "$VERSION" "$PUBLISHED" || {
            STATUS=$?
            test "$STATUS" = 3 && echo "refusing: $PACKAGE@$VERSION already exists"
            test "$STATUS" = 2 && echo "refusing: npm returned an unreadable version list"
            exit 1
          }
          echo "PUBLISH_TARBALL=$TARBALL" >>"$GITHUB_ENV"
          echo "LATEST_BEFORE=$LATEST_BEFORE" >>"$GITHUB_ENV"
          echo "latest_before=$LATEST_BEFORE" >>"$GITHUB_OUTPUT"

      - name: publish the exact candidate to next with OIDC trusted publishing
        env:
          NPM_CONFIG_PROVENANCE: "false"
        run: npm publish "$PUBLISH_TARBALL" --tag next --ignore-scripts --access public --loglevel verbose

  verify-registry:
    name: verify registry bytes without write authority
    needs: [select, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
      NPM_CONFIG_USERCONFIG: /dev/null
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: install the exact read-only npm client
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          npm_prefix="$RUNNER_TEMP/npm-pinned"
          npm install -g --prefix "$npm_prefix" --ignore-scripts --no-audit --no-fund "npm@$NPM_VERSION"
          echo "$npm_prefix/bin" >> "$GITHUB_PATH"
          test "$("$npm_prefix/bin/npm" --version)" = "$NPM_VERSION" || {
            echo "refusing: npm version mismatch"
            exit 1
          }

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: exact-candidate-tarball
          path: ${{ runner.temp }}/verified-artifact

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: relay
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: fetch registry bytes, run the clean canary, and record the next transition
        id: transition
        env:
          CANDIDATE_RECEIPT_DIGEST: ${{ needs.select.outputs.candidate_receipt_digest }}
          CANDIDATE_RUN_ATTEMPT: ${{ needs.select.outputs.run_attempt }}
          CANDIDATE_RUN_ID: ${{ needs.select.outputs.run_id }}
          EXPECTED_SHA256: ${{ needs.select.outputs.tarball_sha256 }}
          LATEST_BEFORE: ${{ needs.publish.outputs.latest_before }}
          SOURCE_SHA: ${{ needs.select.outputs.source_sha }}
          TREE_SHA: ${{ needs.select.outputs.tree_sha }}
          VERSION: ${{ needs.select.outputs.version }}
        run: |
          set -euo pipefail
          umask 077
          test "$(git -C relay rev-parse HEAD)" = "$GITHUB_SHA" || {
            echo "refusing: public verifier checkout differs from the dispatched release SHA"
            exit 1
          }
          TARBALL="$RUNNER_TEMP/verified-artifact/sift-wiki-q-$VERSION.tgz"
          test -f "$TARBALL" && test ! -L "$TARBALL" || {
            echo "refusing: exact tarball missing from no-authority verifier"
            exit 1
          }
          test "$(find "$RUNNER_TEMP/verified-artifact" -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 1 || {
            echo "refusing: verified artifact contains unexpected files"
            exit 1
          }
          test "$(sha256sum "$TARBALL" | cut -d' ' -f1)" = "$EXPECTED_SHA256" || {
            echo "refusing: tarball changed before no-authority verification"
            exit 1
          }
          TRANSITION_DIR=$(mktemp -d "$RUNNER_TEMP/npm-next-transition.XXXXXX")
          REGISTRY_DIR=$(mktemp -d "$RUNNER_TEMP/npm-registry-bytes.XXXXXX")
          READY=false
          for attempt in 1 2 3 4 5 6; do
            if npm view "$PACKAGE@$VERSION" --json >/dev/null; then
              NEXT=$(npm view "$PACKAGE" dist-tags.next 2>/dev/null || true)
              if [ "$NEXT" = "$VERSION" ]; then
                READY=true
                break
              fi
            fi
            echo "attempt $attempt: exact version or next tag not yet visible; waiting 10 seconds"
            sleep 10
          done
          test "$READY" = true || { echo "refusing: published version did not become visible as next"; exit 1; }
          npm pack "$PACKAGE@$VERSION" --ignore-scripts --json --pack-destination "$REGISTRY_DIR" \
            >"$TRANSITION_DIR/npm-pack.json"
          REGISTRY_TARBALL=$(node -e '
            const path = require("node:path");
            const value = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
            if (!Array.isArray(value) || value.length !== 1 ||
                typeof value[0]?.filename !== "string" ||
                path.basename(value[0].filename) !== value[0].filename ||
                !value[0].filename.endsWith(".tgz")) process.exit(1);
            process.stdout.write(path.join(process.argv[2], value[0].filename));
          ' "$TRANSITION_DIR/npm-pack.json" "$REGISTRY_DIR") || {
            echo "refusing: npm pack did not return one safe tarball filename"
            exit 1
          }
          test -f "$REGISTRY_TARBALL" && test ! -L "$REGISTRY_TARBALL" || {
            echo "refusing: registry tarball is not one regular file"
            exit 1
          }
          node relay/scripts/verify-registry-transition.mjs canary \
            --registry-tarball "$REGISTRY_TARBALL" --version "$VERSION" \
            --output "$TRANSITION_DIR/registry-canary.json" \
            >"$TRANSITION_DIR/canary-result.json"
          npm view "$PACKAGE@$VERSION" --json >"$TRANSITION_DIR/registry-package.json"
          NEXT_AFTER_CANARY=$(npm view "$PACKAGE" dist-tags.next) || {
            echo "refusing: cannot read next after the registry canary"
            exit 1
          }
          test "$NEXT_AFTER_CANARY" = "$VERSION" || {
            echo "refusing: next changed during the registry canary"
            exit 1
          }
          LATEST_AFTER_CANARY=$(npm view "$PACKAGE" dist-tags.latest) || {
            echo "refusing: cannot read latest after the registry canary"
            exit 1
          }
          test "$LATEST_AFTER_CANARY" = "$LATEST_BEFORE" || {
            echo "refusing: latest changed during next publication or canary"
            exit 1
          }
          node relay/scripts/verify-registry-transition.mjs record \
            --selected-tarball "$TARBALL" \
            --registry-tarball "$REGISTRY_TARBALL" \
            --registry-metadata "$TRANSITION_DIR/registry-package.json" \
            --canary "$TRANSITION_DIR/registry-canary.json" \
            --source-sha "$SOURCE_SHA" --tree-sha "$TREE_SHA" \
            --candidate-run-id "$CANDIDATE_RUN_ID" \
            --candidate-run-attempt "$CANDIDATE_RUN_ATTEMPT" \
            --candidate-receipt-digest "$CANDIDATE_RECEIPT_DIGEST" \
            --latest-before "$LATEST_BEFORE" --latest-after "$LATEST_AFTER_CANARY" \
            --version "$VERSION" --next-tag-version "$NEXT_AFTER_CANARY" \
            --output "$TRANSITION_DIR/npm-next-transition.json" \
            --promotion-binding-output "$TRANSITION_DIR/npm-latest-promotion-binding.json" \
            >"$TRANSITION_DIR/transition-result.json"
          TRANSITION_DIGEST=$(node -p 'require(process.argv[1]).transitionEvidenceDigest' \
            "$TRANSITION_DIR/transition-result.json")
          echo "transition_evidence_digest=$TRANSITION_DIGEST" >>"$GITHUB_OUTPUT"
          echo "transition_directory=$TRANSITION_DIR" >>"$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-next-transition-${{ needs.select.outputs.version }}
          path: |
            ${{ steps.transition.outputs.transition_directory }}/npm-next-transition.json
            ${{ steps.transition.outputs.transition_directory }}/npm-latest-promotion-binding.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: next transition summary
        env:
          SOURCE_SHA: ${{ needs.select.outputs.source_sha }}
          TRANSITION_DIGEST: ${{ steps.transition.outputs.transition_evidence_digest }}
          VERSION: ${{ needs.select.outputs.version }}
        run: |
          {
            echo "## published and canaried $PACKAGE@$VERSION on next"
            echo
            echo "- exact development source: $SOURCE_REPO @ $SOURCE_SHA"
            echo "- registry bytes: equal to the selected candidate and clean-HOME canary passed"
            echo "- transition evidence: $TRANSITION_DIGEST (unsigned and non-authoritative)"
            echo "- latest: unchanged; a separately governed lane must verify a trusted signed promotion receipt"
          } >>"$GITHUB_STEP_SUMMARY"

  lint-run-logs:
    name: lint job logs for ignored action inputs
    needs: [select, publish, verify-registry]
    if: ${{ always() && needs.select.result != 'skipped' && needs.select.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: scan this run's job logs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          FAIL=0
          SCANNED=0
          JOBS=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" \
                   --jq '.jobs[] | [.id, .name, .status, (.conclusion // "")] | @tsv') || {
            echo "::error::cannot list this run's jobs"; exit 1;
          }
          test -n "$JOBS" || { echo "::error::job list is empty"; exit 1; }
          NEEDLE='Unexpected input''(s)'
          while IFS=$'\t' read -r ID NAME STATUS CONCLUSION; do
            if [ "$STATUS" != completed ] || [ "$CONCLUSION" = skipped ]; then continue; fi
            LOG=$(curl -sSfL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                    "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/jobs/$ID/logs") || {
              echo "cannot read log of $NAME"; FAIL=1; continue;
            }
            test -n "$LOG" || { echo "empty log for $NAME"; FAIL=1; continue; }
            if printf '%s' "$LOG" | grep -nF "$NEEDLE"; then
              echo "::error::job '$NAME' ignored an action input"
              FAIL=1
            else
              SCANNED=$((SCANNED+1))
            fi
          done <<<"$JOBS"
          test "$SCANNED" -ge 1 || { echo "::error::no completed job log was scanned"; exit 1; }
          exit "$FAIL"
