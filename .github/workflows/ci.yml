name: ci
# Relay CI: the workflow-invariant tests run on every change to this repo, so
# a pull request that weakens publish-npm.yml fails here before review.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  invariants:
    name: workflow invariants
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: node --test 'tests/**/*.test.mjs'
